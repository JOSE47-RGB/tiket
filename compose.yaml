name: transmetro
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: transmetro_db
      MARIADB_USER: transmetro
      MARIADB_PASSWORD: ${DB_PASSWORD:?Ejecuta node scripts/configure.cjs}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Ejecuta node scripts/configure.cjs}
      TZ: UTC
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://transmetro:${DB_PASSWORD}@db:3306/transmetro_db
      JWT_SECRET: ${JWT_SECRET:?Ejecuta node scripts/configure.cjs}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ejecuta node scripts/configure.cjs}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TICKET_PRICE: ${TICKET_PRICE:-1.00}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-5}
      LOW_OCCUPANCY_WAIT_MINUTES: ${LOW_OCCUPANCY_WAIT_MINUTES:-5}
      SEED_DEMO: ${SEED_DEMO:-false}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    entrypoint: [sh, /backup-loop.sh]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
